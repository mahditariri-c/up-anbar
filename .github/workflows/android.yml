name: Build Up Anbar

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Up Anbar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.1"
          python -m pip install "buildozer==1.6.0"

      - name: Check Buildozer
        run: |
          buildozer --version

      - name: Build Android debug APK
        working-directory: src
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          yes | buildozer -v android debug

      - name: Show generated files
        if: always()
        working-directory: src
        run: |
          echo "===== BIN ====="
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

          echo "===== BUILD ====="
          find .buildozer -maxdepth 4 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

      - name: Find APK
        id: apk
        working-directory: src
        run: |
          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Up Anbar APK
        uses: actions/upload-artifact@v4
        with:
          name: Up-Anbar-APK
          path: src/${{ steps.apk.outputs.path }}
          if-no-files-found: error
