name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      ANDROIDSDK: /usr/local/lib/android/sdk

      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROIDNDKVER: r28c

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Check Android SDK and NDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_SDK_ROOT"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_NDK"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          if [ -f "$ANDROID_NDK/source.properties" ]; then
            cat "$ANDROID_NDK/source.properties"
          fi


      - name: Install Android packages
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"


      - name: Install Linux dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.34


      - name: Verify Buildozer configuration
        run: |
          set -e

          buildozer --version

          echo "Checking project files..."

          test -f main.py
          test -f buildozer.spec
          test -f icon.png

          echo "Project structure OK"


      - name: Build APK
        run: |
          set -e

          buildozer -v android debug


      - name: Find APK
        run: |
          set -e

          echo "APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: error
