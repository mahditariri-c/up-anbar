name: Build Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Prepare NDK and SDK directories
        run: |
          # ساخت مسیر Buildozer
          mkdir -p /home/runner/.buildozer/android/platform

          # لینک کردن NDK گیت‌هاب به مسیر Buildozer
          ln -sfn /usr/local/lib/android/sdk/ndk/27.3.13750724 \
                 /home/runner/.buildozer/android/platform/android-ndk-r28c

          # لینک کردن SDK گیت‌هاب
          ln -sfn /usr/local/lib/android/sdk \
                 /home/runner/.buildozer/android/platform/android-sdk

          # SDK جدید گیت‌هاب "tools" نداره، باید بسازیم
          sudo mkdir -p /usr/local/lib/android/sdk/tools
          sudo ln -sfn /usr/local/lib/android/sdk/cmdline-tools/latest/bin \
                       /usr/local/lib/android/sdk/tools/bin

          # بررسی
          echo "=== NDK symlink ==="
          ls -la /home/runner/.buildozer/android/platform/android-ndk-r28c
          echo "=== sdkmanager path ==="
          ls -la /usr/local/lib/android/sdk/tools/bin/sdkmanager
          echo "=== Test sdkmanager ==="
          /usr/local/lib/android/sdk/tools/bin/sdkmanager --version || echo "sdkmanager failed"

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
