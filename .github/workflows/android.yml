name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build debug APK with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: yes | buildozer android debug
          workdir: .
          buildozer_version: 1.6.0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error


  release-apk:
    name: Build release APK/AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release package with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: yes | buildozer android release
          workdir: .
          buildozer_version: 1.6.0

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-release
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
