name: Build Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Check Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_NDK"

          echo "NDK directory:"
          ls -la "$ANDROID_NDK"

          echo "NDK version:"
          grep "Pkg.Revision" "$ANDROID_NDK/source.properties" || true

          echo "SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython


      - name: Show Buildozer configuration
        run: |
          buildozer --version
          python --version
          cython --version


      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Build APK
        run: |
          buildozer -v android debug


      - name: Check APK
        run: |
          ls -lah bin/

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: error
