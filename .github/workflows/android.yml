name: Build Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Prepare NDK and SDK directories
        run: |
          # ساخت مسیر Buildozer
          mkdir -p /home/runner/.buildozer/android/platform

          # کپی NDK
          echo "Copying NDK..."
          cp -r /usr/local/lib/android/sdk/ndk/27.3.13750724 \
                /home/runner/.buildozer/android/platform/android-ndk-r28c

          # کپی SDK
          echo "Copying SDK..."
          cp -r /usr/local/lib/android/sdk \
                /home/runner/.buildozer/android/platform/android-sdk

          # ⭐ مهم: کل cmdline-tools/latest رو کپی کن به tools
          # (نه فقط bin رو، چون sdkmanager به lib و .jar نیاز داره)
          echo "Copying cmdline-tools to tools..."
          rm -rf /home/runner/.buildozer/android/platform/android-sdk/tools
          cp -r /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest \
                /home/runner/.buildozer/android/platform/android-sdk/tools

          # بررسی
          echo "=== NDK contents ==="
          ls /home/runner/.buildozer/android/platform/android-ndk-r28c/ | head -5
          echo "=== tools/bin ==="
          ls /home/runner/.buildozer/android/platform/android-sdk/tools/bin/ | head -5
          echo "=== tools/lib ==="
          ls /home/runner/.buildozer/android/platform/android-sdk/tools/lib/ | head -5
          echo "=== sdkmanager test ==="
          /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version || echo "sdkmanager test failed"

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
