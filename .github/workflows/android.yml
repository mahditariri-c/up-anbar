name: Build Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Prepare NDK and SDK directories
        run: |
          # ساخت مسیر Buildozer
          mkdir -p /home/runner/.buildozer/android/platform

          # کپی NDK (نه symlink، چون Buildozer ممکنه با symlink مشکل داشته باشه)
          echo "Copying NDK..."
          cp -r /usr/local/lib/android/sdk/ndk/27.3.13750724 \
                /home/runner/.buildozer/android/platform/android-ndk-r28c

          # کپی SDK
          echo "Copying SDK..."
          cp -r /usr/local/lib/android/sdk \
                /home/runner/.buildozer/android/platform/android-sdk

          # ساخت مسیر tools/bin داخل SDK
          echo "Creating tools/bin..."
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          
          # کپی محتوای cmdline-tools/latest/bin به tools/bin
          cp -r /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/* \
                /home/runner/.buildozer/android/platform/android-sdk/tools/bin/ 2>/dev/null || true

          # بررسی
          echo "=== NDK contents ==="
          ls /home/runner/.buildozer/android/platform/android-ndk-r28c/ | head -5
          echo "=== SDK tools/bin ==="
          ls /home/runner/.buildozer/android/platform/android-sdk/tools/bin/ | head -5
          echo "=== sdkmanager version ==="
          /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version || echo "sdkmanager check failed"

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
