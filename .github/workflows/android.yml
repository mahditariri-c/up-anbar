name: Build Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Prepare NDK and SDK directories
        run: |
          mkdir -p /home/runner/.buildozer/android/platform

          # NDK symlink
          ln -sfn /usr/local/lib/android/sdk/ndk/27.3.13750724 \
                 /home/runner/.buildozer/android/platform/android-ndk-r28c

          # SDK symlink
          ln -sfn /usr/local/lib/android/sdk \
                 /home/runner/.buildozer/android/platform/android-sdk

          # sdkmanager: کپی cmdline-tools به tools
          rm -rf /home/runner/.buildozer/android/platform/android-sdk/tools
          cp -r /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest \
                /home/runner/.buildozer/android/platform/android-sdk/tools

          # بررسی وجود sdkmanager (بدون اجرا)
          echo "=== sdkmanager path ==="
          ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          echo "=== SDK structure ==="
          ls /home/runner/.buildozer/android/platform/android-sdk/

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
