name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Up Anbar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install "cython<3.1"
          python -m pip install buildozer

      - name: Check project files
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la

          echo "===== REQUIRED FILES ====="

          test -f main.py
          test -f buildozer.spec
          test -f icon.png

          echo "main.py: OK"
          echo "buildozer.spec: OK"
          echo "icon.png: OK"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

          yes | sdkmanager --licenses || true

      - name: Build Android debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        id: find_apk
        run: |
          echo "===== BIN ====="
          find bin -maxdepth 2 -type f -print || true

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Up Anbar APK
        uses: actions/upload-artifact@v4
        with:
          name: Up-Anbar-APK
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
