name: Build Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Build debug APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: android debug
          workdir: .
          buildozer_version: master

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-debug-apk
          path: bin/*.apk
          if-no-files-found: error

  release-bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Build release AAB
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: android release
          workdir: .
          buildozer_version: master

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: up-anbar-release
          path: |
            bin/*.aab
            bin/*.apk
          if-no-files-found: warn
