[app]
title = Up Anbar
package.name = upanbar
package.domain = org.mahditariri

source.dir = .
source.include_exts = py,kv,png,jpg,jpeg,ttf,otf,txt,json,md
source.include_patterns = fonts/*.ttf,fonts/*.otf

version = 10.0

requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow,openpyxl,reportlab,arabic-reshaper,python-bidi,kivy_garden.graph

orientation = portrait
fullscreen = 0

icon.filename = %(source.dir)s/icon.png


[buildozer]
log_level = 2
warn_on_root = 1


[android]

# Android 7+
android.minapi = 24

# فعلاً برای ساخت تستی
android.api = 33
android.targetapi = 33

# معماری‌های رایج
android.archs = arm64-v8a, armeabi-v7a

# Backup
android.allow_backup = True

# پذیرش License در CI
android.accept_sdk_license = True

# NDK را نسخه‌ای می‌کنیم، ولی مسیر مطلق نمی‌دهیم
android.ndk = 27b

# دسترسی‌های فعلی برنامه
android.permissions = CAMERA,WRITE_EXTERNAL_STORAGE
